<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClaudeBot</title>
<style>
:root{
  --bg:#faf9f5; --card:#ffffff; --panel:#f3f1ea; --raise:#ebe8dd; --line:#e2dfd3; --text:#1f1e1d; --muted:#73716a;
  --brand:#c96442; --brand-hover:#b4573a; --accent:#b4522f; --ok:#4f7a3a; --warn:#b07a1a; --bad:#b3372c; --bad-soft:#f9e6e1; --ok-soft:#e5eed9;
  --term:#262624; --term-text:#e8e6dc; --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --serif:Georgia,"Times New Roman","Malgun Gothic","Apple SD Gothic Neo",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#262624; --card:#30302e; --panel:#1f1e1d; --raise:#383835; --line:#42413d; --text:#f3f1ea; --muted:#a3a198;
  --accent:#e8896a; --ok:#9bc27a; --warn:#e2b659; --bad:#ee8b7e; --bad-soft:#47272a; --ok-soft:#2c3a22;
  --term:#1a1918; --term-text:#e8e6dc;
}}
:root[data-theme=dark]{
  --bg:#262624; --card:#30302e; --panel:#1f1e1d; --raise:#383835; --line:#42413d; --text:#f3f1ea; --muted:#a3a198;
  --accent:#e8896a; --ok:#9bc27a; --warn:#e2b659; --bad:#ee8b7e; --bad-soft:#47272a; --ok-soft:#2c3a22;
  --term:#1a1918; --term-text:#e8e6dc;
}
:root[data-size=large] body{font-size:17px}
:root[data-size=large] .msg.agent{font-size:18px}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.6 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 12px}
button:hover{background:var(--raise)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
button.primary:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.ghost:hover{color:var(--text);background:var(--raise)}
button.danger{color:var(--bad)}
.app{display:grid;grid-template-columns:256px minmax(0,1fr) 380px;height:100%}
.app.noside{grid-template-columns:256px minmax(0,1fr)}
/* sidebar */
.team{background:var(--panel);display:flex;flex-direction:column;min-height:0}
.brand{padding:14px 14px 8px;display:flex;align-items:center;gap:8px}
.brand b{font-size:17px;font-family:var(--serif);font-weight:600;letter-spacing:-.2px}

.brand .link{margin-left:auto;font-size:12px;padding:2px 6px;color:var(--muted);display:flex;align-items:center;gap:6px}
.navbtn{margin:1px 8px;text-align:left;background:transparent;border:0;display:flex;gap:10px;align-items:center;padding:8px 10px;font-weight:600;font-size:14px}
.navbtn.sel{background:var(--raise)}
.navbtn .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--raise);flex:none}
.navbtn.sel .ic{background:var(--card)}
.sect{padding:14px 10px 4px;font-size:12px;color:var(--muted)}
.proj{margin-bottom:6px}
.phead{display:flex;align-items:center;border-radius:9px}
.phead.sel{background:var(--raise)}
.pname{flex:1;min-width:0;text-align:left;border:0;background:none;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px;padding:7px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pname:hover{background:none}
.folder{width:14px;height:10px;border-radius:2px;background:var(--brand);position:relative;flex:none;margin-top:2px}
.folder::before{content:"";position:absolute;left:0;top:-3px;width:6px;height:3px;border-radius:2px 2px 0 0;background:var(--brand)}
.px{padding:2px 8px;font-size:15px;line-height:1}
.proj .item{padding-left:22px}
.ppage{overflow:auto}
.crumb{display:flex;align-items:center;gap:10px;padding:14px 26px;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}
.crumb i{font-style:normal;color:var(--line)}.crumb b{color:var(--text)}
.plog{flex:1;overflow:auto}
.pcol{max-width:760px;margin:0 auto;padding:34px 26px 60px}
.pcol h1{margin:0;font:500 34px/1.25 var(--serif);letter-spacing:-.4px}
.pdir{margin:6px 0 22px;color:var(--muted);font:12px var(--mono);overflow-wrap:anywhere}
.pcol .box{margin-bottom:6px}
.pcol .box textarea{width:100%;display:block;border:0;background:transparent;resize:none;outline:none;min-height:52px;padding:2px 0 6px}
.psec{margin:26px 0 6px;font-size:13px;color:var(--muted)}
.prow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 6px;border:0;border-bottom:1px solid var(--line);background:none;border-radius:0}
button.prow:hover{background:var(--raise);border-radius:10px}
.pic{width:30px;height:30px;display:grid;place-items:center;flex:none;color:var(--muted)}
.pnm{width:110px!important;border:1px solid var(--line)!important;border-radius:9px!important;padding:4px 10px!important;font-size:13px}
.prow.agent .pic{background:none}
.pmeta{flex:1;min-width:0;display:grid}
.pmeta b{font-size:15px}.pmeta span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pact{font-weight:600;color:var(--text)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;display:inline-block}
.dot.on{background:var(--ok)} .dot.busy{background:var(--warn);animation:pulse 1.2s infinite} .dot.err{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
.list{flex:1;overflow:auto;padding:0 8px 8px}
.item{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;border:0;width:100%;text-align:left;background:transparent}
.item.sel{background:var(--raise)}
.face{flex:none;position:relative;display:block}
.face svg{display:block}
.face .dot{position:absolute;right:-3px;bottom:-3px;border:2px solid var(--panel);width:11px;height:11px}
.item .meta{min-width:0;flex:1}
.item .name{font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center}
.item .prev{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--brand);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;margin-left:auto;font-weight:600}
/* chat */
.chat{display:flex;flex-direction:column;min-width:0;min-height:0}
.head{display:flex;align-items:center;gap:10px;padding:12px 22px}
.head .t{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .t b{font-size:16px}
.head .t span{color:var(--muted);font-size:13px;margin-left:8px}
.chip{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 9px;white-space:nowrap}
.log{flex:1;overflow:auto;padding:10px 0 24px}
.col{max-width:780px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:12px}
.msg{white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--raise);padding:10px 16px;border-radius:18px 18px 6px 18px;max-width:80%}
.msg.agent{font-family:var(--resp,var(--serif));font-size:16px;line-height:1.7}
.msg .to{display:block;font-size:11.5px;color:var(--muted)}
.msg code{font-family:var(--mono);font-size:13px;background:var(--raise);border-radius:5px;padding:1px 5px}
.msg pre{background:var(--term);color:var(--term-text);border-radius:12px;padding:12px 14px;overflow:auto;margin:8px 0;white-space:pre;font-size:13px}
.msg pre code{padding:0;background:none}
.msg a{color:var(--accent)}
.msg h5{margin:6px 0 0;font-size:17px;font-weight:600}
.msg.live::after{content:"";display:inline-block;width:8px;height:15px;background:var(--text);margin-left:2px;vertical-align:-2px;animation:pulse 1s infinite}
.who{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;margin-bottom:-6px}
details.think{color:var(--muted);font-size:13.5px}
details.think summary{cursor:pointer;list-style:none;display:inline-flex;gap:7px;align-items:center}
details.think summary::after{content:"›";font-size:15px;line-height:1;transition:transform .15s}
details.think[open] summary::after{transform:rotate(90deg)}
.spark{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--brand);flex:none}
details.think.live .spark{animation:pulse 1s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
details.think div{white-space:pre-wrap;border-left:2px solid var(--line);padding:2px 0 2px 12px;margin-top:4px}
.toolc{font-size:13px}
.toolc summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-family:var(--mono);font-size:12.5px}
.toolc summary::-webkit-details-marker,details.think summary::-webkit-details-marker{display:none}
.toolc summary .dot{transform:translateY(-1px)}
.toolc summary b{flex:none}
.toolc summary span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toolc .peek{font-family:var(--mono);font-size:12px;color:var(--muted);padding-left:16px;white-space:pre;overflow:hidden;text-overflow:ellipsis;max-height:3.2em}
.toolc .body{margin:6px 0 2px 16px;display:grid;gap:6px}
.toolc pre{margin:0;background:var(--term);color:var(--term-text);border-radius:10px;padding:10px 12px;overflow:auto;max-height:320px;font:12.5px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.toolc .lab{font-size:11.5px;color:var(--muted)}
.diff div{white-space:pre-wrap;padding:0 8px;font:12.5px/1.5 var(--mono);overflow-wrap:anywhere}
.diff{border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:320px;padding:6px 0}
.diff .del{background:var(--bad-soft)} .diff .add{background:var(--ok-soft)}
.todos{border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:grid;gap:3px;font-size:13.5px}
.todos .done{color:var(--muted);text-decoration:line-through}
.todos .now{font-weight:600}
.meta{color:var(--muted);font-size:12px}
.card{border:1px solid var(--line);border-radius:14px;padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.card .lab{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:2px}
.card.err{background:var(--bad-soft);border-color:transparent}
.card.err .lab{color:var(--bad)}
.sys{align-self:center;color:var(--muted);font-size:12.5px;text-align:center}
.typing{display:flex;align-items:center;gap:5px;height:18px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:hop 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes hop{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.compose{padding:0 24px 12px}
.box{max-width:780px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px 12px 8px 18px;box-shadow:0 2px 10px rgba(60,50,30,.06)}
.box:focus-within{border-color:#cfc9b6;box-shadow:0 3px 16px rgba(60,50,30,.1)}
.box textarea{width:100%;display:block;border:0;background:transparent;resize:none;outline:none;max-height:180px;min-height:26px;padding:2px 0 6px}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ctl select{border:1px solid transparent;background:transparent;border-radius:8px;padding:3px 4px;font-size:12.5px;color:var(--muted);max-width:170px;cursor:pointer}
.ctl select:hover{background:var(--line);color:var(--text)}
.ctl select option{background:var(--card);color:var(--text)}
.ctl .to{font-size:12.5px;padding:2px 10px;border-radius:999px}
.ctl .to.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.ctl .sp{flex:1}
.sendbtn{width:34px;height:34px;border-radius:50%;padding:0;display:grid;place-items:center;flex:none}
.sendbtn.stop{background:var(--bad);border-color:var(--bad);color:#fff}
.hint{max-width:780px;margin:6px auto 0;color:var(--muted);font-size:11.5px;text-align:center}
.empty{flex:1;display:grid;place-items:center;text-align:center;padding:24px}
.empty h2{margin:10px 0 6px;font-size:28px;font-family:var(--serif);font-weight:500;letter-spacing:-.3px}
.empty p{color:var(--muted);margin:0 auto 18px;max-width:440px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
/* right side */
.side{background:var(--panel);display:flex;flex-direction:column;min-height:0}
.stage{margin:12px 14px 0;padding:14px 16px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;background:#1f1e1d;border:1px solid #3d3a33;border-radius:12px;background-image:radial-gradient(#34322d 1px,transparent 1.2px);background-size:14px 14px;color:#e8e6dc}
.stage .bubble{background:#262624;border-color:#4a463d;color:#e8e6dc;font-family:var(--mono);font-size:12px}
.stage .mascot .shadow{fill:rgba(0,0,0,.35)}
.mascot svg{shape-rendering:crispEdges}
.mascot.img img{width:100%;height:100%;object-fit:contain;display:block}
.mascot.img{animation:none}
.welcome{display:inline-flex;flex-direction:column;align-items:center;gap:10px;border:1px solid #c96442;border-radius:10px;padding:22px 34px 18px;background:#1f1e1d;color:#e8e6dc;font-family:var(--mono);text-align:center;max-width:460px}
.welcome b{color:#e8896a;font-weight:600}
.welcome small{white-space:pre-line;color:#a3a198;font-size:12.5px;line-height:1.6}
.hello{display:grid;place-items:center;gap:10px;padding:60px 0 10px;text-align:center}
.hello h3{margin:0;font:500 28px/1.3 var(--serif);letter-spacing:-.3px}
.acts{display:flex;gap:4px;margin-top:2px}
.acts button{border:0;background:none;color:var(--muted);font-size:12px;padding:3px 8px;border-radius:7px}
.acts button:hover{background:var(--raise);color:var(--text)}
.amsg .acts{opacity:0;transition:opacity .15s}.amsg:hover .acts,.amsg:focus-within .acts{opacity:1}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px 12px;font-size:12.5px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.mascot{width:128px;height:118px}
.mascot svg{width:100%;height:100%;overflow:visible}
.mascot .shadow{fill:rgba(60,40,20,.14)}
.mascot .ink{fill:#2b1d17}
.mascot .line{fill:none;stroke:#2b1d17;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.mascot .shine{fill:#fff}
.mascot .blush{fill:#fff;opacity:.3}
.mascot .xeyes,.mascot .prop,.mascot .zz,.mascot .sleep{display:none}
.mascot.act-doc .p-laptop,.mascot.act-working .p-laptop,.mascot.act-run .p-laptop,.mascot.act-task .p-laptop,.mascot.act-run .p-term,.mascot.act-read .p-book,.mascot.act-web .p-lens,.mascot.act-find .p-lens,.mascot.act-todo .p-clip,.mascot.act-thinking .p-dots{display:block}
.mascot.act-thinking .eyes{animation:none!important;transform:translate(2px,-4px)!important}
.mascot.act-read .eyes{animation:none!important;transform:translateY(4px)!important}
.mascot.act-web .eyes,.mascot.act-find .eyes{animation:none!important;transform:translateX(4px)!important}
.mascot.act-thinking .p-dots rect{animation:pulse 1.1s infinite}.mascot.act-thinking .p-dots rect:nth-child(2){animation-delay:.25s}.mascot.act-thinking .p-dots rect:nth-child(3){animation-delay:.5s}
.mascot .prop rect{stroke:none}
.mascot .zz{fill:#a3a198;font:700 15px ui-monospace,Consolas,monospace}
.mascot .all,.mascot .eyes,.mascot .bulb,.mascot .arm{transform-box:fill-box;transform-origin:center}
.mascot .all{animation:bob 3.4s ease-in-out infinite}
.mascot .eyes{animation:blink 4.6s infinite}
.mascot .bulb{fill:#f6c453}
.mascot.working .all{animation:bob .8s ease-in-out infinite}
.mascot.working .eyes{animation:scan 1.1s ease-in-out infinite}
.mascot.working .bulb{animation:pulse .7s infinite}
.mascot.working .arm{animation:tap .26s ease-in-out infinite alternate}
.mascot.working .arm.r{animation-delay:.13s}
.mascot.error .eyes,.mascot.error .smile{display:none}
.mascot.error .xeyes{display:block}
.mascot.error .all{animation:wob .5s ease-in-out 3;filter:saturate(.3)}
.mascot.error .bulb{fill:#b8b8c2}
.mascot.rest .eyes{display:none}.mascot.rest .sleep,.mascot.rest .zz{display:block}
.mascot.rest .zz{animation:float 2.6s infinite}
.mascot.rest .bulb{fill:#b8b8c2}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes scan{0%,100%{transform:translate(-3px,3px)}50%{transform:translate(3px,3px)}}
@keyframes float{0%{opacity:0;transform:translateY(4px)}40%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
@keyframes tap{to{transform:translateY(-4px)}}
@keyframes wob{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@media (prefers-reduced-motion:reduce){.mascot *,.typing i,.dot.busy,.msg.live::after{animation:none!important}}
.tabs{display:flex;gap:4px;padding:6px 12px 0}
.tabs button{border:0;border-radius:8px;background:none;color:var(--muted);padding:5px 12px;font-size:13px}
.tabs button.on{color:var(--text);background:var(--raise);font-weight:600}
.pane{flex:1;overflow:auto;padding:12px 14px}
.pane h4{margin:14px 0 4px;font-size:12px;color:var(--muted);font-weight:600}
.pane h4:first-child{margin-top:0}
.note{color:var(--muted);font-size:12.5px}
.file{display:flex;gap:8px;padding:5px 8px;border-radius:8px;font-size:13px;text-decoration:none;color:inherit}
.file:hover{background:var(--raise)}
.file,.win .fi{cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.fmenu{position:fixed;z-index:200;min-width:170px;background:var(--card,#fff);border:1px solid var(--line,#ddd);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:6px;display:flex;flex-direction:column}
.fmenu .fmt{padding:6px 10px 8px;font-size:12px;color:var(--muted,#777);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmenu button{text-align:left;padding:11px 12px;border-radius:8px;font-size:14.5px;background:none;border:0;color:inherit;cursor:pointer}
.fmenu button:hover{background:var(--raise,#f2efe9)}
.fmenu button.danger{color:#c0392b}
.file .sz{margin-left:auto;color:var(--muted);font-size:11.5px;flex:none}
.file .p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.path{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
.office{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.office button{display:flex;flex-direction:column;align-items:center;gap:0;padding:10px 6px 8px;border-radius:14px;background:var(--card);min-width:0}
.office .mascot{width:92px;height:86px}
.office .bubble{font-size:11.5px;padding:3px 9px}
.office b{font-size:13px}
/* virtual desktop (own design) */
.deskwrap{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);cursor:zoom-in;background:#1f1e1d}
.desk{width:960px;height:600px;position:relative;overflow:hidden;font:13px/1.45 "Pretendard","Malgun Gothic",system-ui,sans-serif;color:#1b1b20;user-select:none;transform-origin:0 0}
.desk .wall{position:absolute;inset:0}
.desk .icons{position:absolute;left:14px;top:14px;display:grid;gap:14px}
.desk .dicon{width:72px;text-align:center;color:#d8d3c4;font-size:12px}
.desk .dicon i{display:block;font-style:normal;font:700 22px/1.3 var(--mono);color:#e07b57}
.win{position:absolute;background:#fbfbfd;border-radius:9px;box-shadow:0 12px 40px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden}
.win.back{filter:brightness(.97)}
.win .tb{height:32px;display:flex;align-items:center;gap:8px;padding:0 0 0 10px;background:#eceef3;flex:none;cursor:default}
.win .tb .ttl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.win .tb .wb{width:40px;height:32px;display:grid;place-items:center;font-size:12px;color:#444}
.win .tb .wb.x:hover{background:#d8453a;color:#fff}
.win .menu{display:flex;gap:14px;padding:3px 12px;font-size:12px;color:#555;border-bottom:1px solid #e3e5ea;flex:none}
.win .wbody{flex:1;overflow:auto;min-height:0;user-select:text}

async function loadState(){
  const st=await api('/api/state');
  S.agents=st.agents;S.projects=st.projects||[];S.msgs=st.msgs;S.seq=st.seq;cache.clear();
  if(!isTeam()&&!isProj()&&!S.agents.find(a=>a.id===S.cur))S.cur=S.agents[0]?.id||null;

let polling=false;
async function poll(){
  if(polling)return;polling=true;let fails=0;
  for(;;){
    try{
      const r=await api('/api/events?since='+S.seq);
      fails=0;if(S.lost){S.lost=false;render()}
      if(r.resync){await loadState();render();continue}
      S.seq=r.seq;let full=false;
      for(const ev of r.events||[])full=apply(ev)||full;
      if(r.events?.length)full?render():renderLive();
    }catch(e){
      if(++fails>=3){S.lost=true;render();polling=false;connect();return}
      await sleep(1500);
    }
  }
}
function apply(ev){
  if(ev.type==='msg'){
    (S.msgs[ev.m.agent]??=[]).push(ev.m);
    const quiet=['tool','thinking','meta'].includes(ev.m.kind)||ev.m.from==='user';
    if(!quiet&&ev.m.agent!==S.cur&&!isTeam()&&!isProj())S.unread[ev.m.agent]=(S.unread[ev.m.agent]||0)+1;
    return false;
  }
  if(ev.type==='upd'){const l=S.msgs[ev.m.agent]||[];const i=l.findIndex(m=>m.id===ev.m.id);if(i>=0)l[i]=ev.m;return false}
  if(ev.type==='delta'){const m=(S.msgs[ev.agent]||[]).findLast(m=>m.id===ev.id);if(m)m.text+=ev.add;return false}
  if(ev.type==='agent'){
    const i=S.agents.findIndex(a=>a.id===ev.a.id);
    if(i>=0){const o=S.agents[i];S.agents[i]=ev.a;if(o.status==='working'&&ev.a.status!=='working'&&ev.a.status!=='error'&&!(S.cur===ev.a.id&&document.hasFocus()))S.ready[ev.a.id]=Date.now();return o.name!==ev.a.name||o.model!==ev.a.model||o.mode!==ev.a.mode||o.effort!==ev.a.effort||o.role!==ev.a.role||o.actual_model!==ev.a.actual_model}
    S.agents.push(ev.a);if(!S.cur)S.cur=ev.a.id;return true;
  }
  if(ev.type==='removed'){S.agents=S.agents.filter(a=>a.id!==ev.id);delete S.msgs[ev.id];if(S.cur===ev.id)S.cur=S.agents[0]?.id||null;return true}
  if(ev.type==='project'){const i=S.projects.findIndex(p=>p.id===ev.p.id);if(i>=0)S.projects[i]=ev.p;else S.projects.push(ev.p);return true}
  if(ev.type==='project_removed'){S.projects=S.projects.filter(p=>p.id!==ev.id);if(S.cur==='team:'+ev.id||S.cur==='proj:'+ev.id)S.cur=S.agents[0]?.id||null;return true}
  if(ev.type==='reset'){S.msgs[ev.id]=[];return true}
  if(ev.type==='reminder'){toast(ev.title||'알림',ev.text||'');loadAssist();return false}
  if(ev.type==='assist'){loadAssist();return false}
  return false;
}

function poolUrl(k){
  const pl=charPools()[k];if(!pl||!pl.length)return '';const lib=charLib();
  const urls=pl.flatMap(f=>lib[f]||[]);if(!urls.length)return '';
  let hsh=0;for(const c of k)hsh=(hsh*31+c.charCodeAt(0))>>>0;
  return urls[(hsh+Math.floor(Date.now()/25000))%urls.length];
}

function toolLine(m){const d=m.data||{};const i=d.input||{};const arg=i.command||i.file_path||i.path||i.url||i.query||i.pattern||i.description||i.prompt||'';return[d.name||m.text,String(arg).replace(/\s+/g,' ')]}

function mood(a){
  const list=S.msgs[a.id]||[];const last=list.at(-1);
  if(a.status==='working'){
    const t=list.findLast(m=>m.kind==='tool');
    if(t&&list.indexOf(t)>=list.length-3&&t.data&&t.data.result==null){const[n,arg]=toolLine(t);return['working',(n+' · '+arg).slice(0,44),actOf(n)]}
    return last&&last.kind==='thinking'?['working','생각하는 중…','thinking']:['working','일하는 중…','working'];
  }
  if(a.queue>0)return['working','곧 시작할게요','working'];
  if(a.status==='error')return['error','문제가 생겼어요','error'];
  if(!last)return['idle','무엇을 할까요?','idle'];
  if(Date.now()-last.time<90000&&last.from!=='user')return['idle','다 했어요','idle'];
  return['rest','쉬는 중','rest'];
}

function drawTerm(){

      h('div',{class:'actions'},h('button',{onclick:closeDlg},'닫기'),h('button',{class:'primary',onclick:async()=>{await post('/api/term/enable',{enabled:true});T.on=true;drawTerm()}},'터미널 켜기')));
  }else{
    const inp=h('input',{type:'text',id:'terminp',placeholder:'명령을 입력하고 Enter (예: git status, ls, claude --version)',autocomplete:'off',spellcheck:'false',
      onkeydown:async e=>{
        if(e.key==='ArrowUp'){e.preventDefault();if(T.hi>0){T.hi--;inp.value=T.hist[T.hi]||''}}
        else if(e.key==='ArrowDown'){e.preventDefault();if(T.hi<T.hist.length){T.hi++;inp.value=T.hist[T.hi]||''}}
        else if(e.key==='Enter'){const cmd=inp.value.trim();if(!cmd||T.busy)return;inp.value='';T.hist.push(cmd);T.hi=T.hist.length;T.lines.push('$ '+cmd);T.busy=true;paintTerm();
          try{const r=await post('/api/term/run',{cmd});if(r.out)T.lines.push(r.out.replace(/\s+$/,''));if(r.code)T.lines.push('[종료 코드 '+r.code+']');T.cwd=r.cwd}catch(x){T.lines.push('오류: '+x.message)}
          T.busy=false;if(T.lines.length>400)T.lines.splice(0,T.lines.length-400);paintTerm()}}});

      h('div',{class:'actions',style:'margin-top:8px'},h('button',{onclick:async()=>{await post('/api/term/enable',{enabled:false});T.on=false;drawTerm()}},'터미널 끄기'),h('button',{class:'primary',onclick:closeDlg},'닫기')));

  render();
  setTimeout(()=>{const i=$('#terminp');if(i)i.focus();const o=$('#termout');if(o)o.scrollTop=o.scrollHeight},30);

const CHAR_DEFAULT={idle:'idle',thinking:'thinking',read:'reading',doc:'writing',run:'bash',web:'web-fetch',find:'search',todo:'todo-list',working:'multitasking',error:'tool-failure',rest:'idle-doze'};
function pickCharFolder(files){
  const m={};
  const all={};
  for(const f of files){const p=(f.webkitRelativePath||'').split('/');if(p.length<2)continue;const folder=p[p.length-2];const n=p[p.length-1].toLowerCase();
    if(/^loop(-2)?\.(gif|png|webp)$/.test(n))(all[folder]??=[]).push(f);
    if(/^loop\.(gif|png|webp)$/.test(n))m[folder]=f;else if(!m[folder]&&/^full\.(gif|png|webp)$/.test(n)){m[folder+'\u0000full']=f}}
  for(const k of Object.keys(m))if(k.endsWith('\u0000full')){const nm=k.slice(0,-5);if(!m[nm])m[nm]=m[k];delete m[k]}
  S.cpk={all,folders:m,sel:Object.fromEntries(CHAR_KEYS.map(([k])=>[k,m[CHAR_DEFAULT[k]]?CHAR_DEFAULT[k]:'']))};
  openSettings('chars');
}

async function uploadCharAll(){
  const e=$('#cherr');const all=S.cpk.all||{};const names=Object.keys(all).sort();
  const lib=charLib();let n=0,skip=0,total=names.reduce((a,k)=>a+all[k].length,0);
  for(const folder of names){
    lib[folder]=[];
    for(const f of all[folder]){
      if(f.size>12e6){skip++;continue}
      e.textContent=`올리는 중… ${n+skip+1}/${total}`;
      const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]||'');fr.readAsDataURL(f)});
      try{const x=await post('/api/charimg',{name:folder+'_'+f.name,data});lib[folder].push(S.conn.url+x.url+'?t='+encodeURIComponent(S.conn.token));n++}catch(err){e.textContent=err.message;try{localStorage.setItem('cb.charlib',JSON.stringify(lib))}catch(_){}return}
    }
  }
  try{localStorage.setItem('cb.charlib',JSON.stringify(lib));if(!Object.keys(charPools()).length)localStorage.setItem('cb.charpool',JSON.stringify(CHAR_POOLS))}catch(err){e.textContent='브라우저 저장 공간이 부족해요: '+err.message;return}

  openSettings('chars');const e2=$('#cherr');if(e2)e2.textContent=msg;
}
async function uploadCharPicked(){

    e.textContent=`올리는 중… (${n+1})`;
    const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]||'');fr.readAsDataURL(f)});

        rowBtn('고치기',()=>api('/api/md/'+encodeURIComponent(d.name)).then(r=>{S.mdf={name:r.name,text:r.text};render()})),
        rowBtn('×',()=>{if(confirm(d.name+'.md 를 지울까요?'))post('/api/md/'+encodeURIComponent(d.name)+'/delete').then(reloadMd)},'ghost'))):h('p',{class:'note'},'아직 문서가 없어요.'));
  }else if(S.asTab==='note'){
    body=h('div',{},
      h('p',{class:'note',style:'margin:0 0 6px'},'모든 에이전트가 일을 시작할 때 이 노트를 읽어요. 나를 처음부터 설명하지 않아도 되도록 오래 쓸 내용만 적어 두세요. 비밀번호나 카드번호는 적지 마세요.'),
      h('textarea',{class:'in',id:'notetxt',style:'min-height:170px',placeholder:'예) 이름, 하는 일, 말투 선호, 진행 중인 프로젝트…'},A.notes||''),
      h('div',{class:'actions',style:'margin-top:8px'},h('span',{class:'note',id:'noteok',style:'align-self:center'},''),h('button',{class:'primary',onclick:()=>post('/api/notes',{text:$('#notetxt').value}).then(()=>{$('#noteok').textContent='저장했어요.'}).catch(e=>alert(e.message))},'저장')),
      A.sugg.length?h('div',{class:'dgsec'},'에이전트가 제안한 내용'):null,
      A.sugg.map(s=>h('div',{class:'arow'},h('div',{class:'grow'},s.text,h('small',{},s.agent+'가 제안')),
        rowBtn('추가',()=>post('/api/note-sugg/'+s.id,{action:'add'}).then(reload),'primary'),rowBtn('무시',()=>post('/api/note-sugg/'+s.id,{action:'drop'}).then(reload)))),
      h('p',{class:'note'},'이 노트는 지금 이 사용자('+(A.user==='owner'?'기본':A.user)+')의 것이에요. 나중에 로그인 기능이 생기면 사용자마다 따로 저장돼요.'));
  }else{
    const p=pendCards();
    body=h('div',{},h('p',{class:'note',style:'margin:0 0 6px'},'에이전트가 되돌리기 어려운 일 앞에서 멈추고 묻는 카드, 에이전트가 직접 하는 질문, 중간에 끊긴 작업이에요.'),
      p.length?p.map(({a,m})=>h('div',{},h('small',{class:'note'},a.name),actCard(m,m.kind))):h('p',{},'기다리는 승인이 없어요.'));
  }
  return h('div',{class:'veil',onclick:e=>{if(e.target.classList.contains('veil'))closeDlg()}},h('div',{class:'dlg wide',role:'dialog','aria-modal':'true'},
    h('div',{class:'dhead'},h('h3',{},'비서'),h('button',{class:'ghost',onclick:closeDlg,'aria-label':'닫기'},'×')),
    h('div',{class:'stabs'},asTabs.map(([k,t])=>h('button',{class:S.asTab===k?'on':'',onclick:()=>openAssist(k)},t,k==='ok'&&pendCards().length?h('span',{class:'badge'},pendCards().length):k==='note'&&A.sugg.length?h('span',{class:'badge'},A.sugg.length):null))),
    h('div',{class:'sbody'},body)));
}
// 다시 열었을 때 그동안의 일을 보여 줍니다.
setInterval(()=>{try{localStorage.setItem('cb.alive',String(Date.now()))}catch(e){}},30000);
async function maybeDigest(){
  let last=0;try{last=+localStorage.getItem('cb.alive')||0}catch(e){}
  try{localStorage.setItem('cb.alive',String(Date.now()))}catch(e){}
  if(!last||Date.now()-last<10*60000||S.dialog)return;
  try{const d=await api('/api/digest?since='+last);if(d.empty)return;S.dg=d;S.dgSince=last;S.asTab='sum';S.dialog=assistDlg;render();loadAssist()}catch(e){}
}
const exposedWarn=()=>S.as&&S.as.exposed?h('div',{class:'warnbar',role:'alert'},`실행기가 ${S.as.listen} 로 열려 있어요. 이 컴퓨터 밖에서도 접속을 시도할 수 있고, 연결은 암호화되지 않아요. Tailscale 같은 VPN 을 쓰는 걸 권해요 (설정 > 도움말 3번).`):null;
const CHECK=[['conn','실행기를 켜고 앱을 연결 코드로 연결했다'],['agent','에이전트를 만들어 간단한 일을 시키고 답을 받았다'],['login','로그인이 필요한 사이트에서 "로그인 필요" 카드가 뜨고, 가상 화면에서 로그인했다'],['apps','가상 화면에서 계산기·메모장 같은 앱을 열었다'],['sched','예약 작업을 1~2분 뒤로 만들어 실제로 실행되는 것을 봤다'],['todo','할 일을 1~2분 뒤 마감으로 넣고 알림이 떴다'],['ask','위험한 일을 시켜 보고 승인 카드가 뜨는지 봤다'],['resume','일하는 중에 실행기를 껐다 켰더니 이어하기 카드가 떴다'],['restart','실행기를 껐다 켜도 대화·예약·할 일이 그대로 남아 있었다'],['service','서비스로 등록한 뒤 컴퓨터를 다시 켰더니 실행기가 저절로 켜졌다']];
const checkGet=()=>{try{return JSON.parse(localStorage.getItem('cb.check')||'{}')}catch(e){return{}}};
function diagBody(){
  const A=S.as||{};const D=S.dx;const ck=checkGet();
  const runDx=()=>{S.dxBusy=true;openSettings();api('/api/selftest').then(r=>{S.dx=r;S.dxBusy=false;openSettings()}).catch(e=>{S.dx={err:e.message};S.dxBusy=false;openSettings()})};
  const svc=act=>post('/api/service',{action:act}).then(r=>{S.svcMsg=r.message;S.svcBad=!r.ok;loadAssist();api('/api/selftest').then(x=>{S.dx=x;openSettings()})}).catch(e=>{S.svcMsg=e.message;S.svcBad=true;openSettings()});
  const done=CHECK.filter(([k])=>ck[k]).length;
  return h('div',{},
    h('p',{class:'note',style:'margin:0 0 6px'},'지금 이 컴퓨터가 ClaudeBot 을 쓸 준비가 됐는지 확인해요. ✗ 에는 고치는 방법이 같이 나와요.'),
    h('div',{class:'actions',style:'margin:0 0 8px;justify-content:flex-start'},h('button',{class:'primary',disabled:S.dxBusy,onclick:runDx},S.dxBusy?'확인 중…':'진단 실행'),D&&D.total?h('span',{class:'note',style:'align-self:center'},`${D.ok}/${D.total} 정상`):null),
    D&&D.err?h('div',{class:'errline'},D.err):null,
    D&&D.checks?D.checks.map(c=>h('div',{class:'arow'},h('b',{class:c.ok?'okx':'badx',style:'width:18px'},c.ok?'✓':'✗'),h('div',{class:'grow'},c.name,h('small',{},c.detail),c.ok?null:h('small',{style:'color:var(--warn)'},'→ '+c.fix)))):h('p',{class:'note'},'아직 진단하지 않았어요.'),
    h('div',{class:'srow'},h('div',{},h('b',{},'컴퓨터를 켜면 자동으로 시작'),h('small',{},A.service?'등록되어 있어요. 실행기가 꺼져도 몇 초 뒤 다시 켜져요.':'등록하면 컴퓨터를 켤 때 실행기가 저절로 켜져요. (지금 켜져 있는 실행기는 그대로 둬요)')),
      A.service?h('button',{onclick:()=>svc('uninstall')},'해제'):h('button',{class:'primary',onclick:()=>svc('install')},'서비스로 등록')),
    S.svcMsg?h('div',{class:S.svcBad?'errline':'note',style:'margin-top:6px'},S.svcMsg):null,
    h('div',{class:'dgsec'},`하루 써 보기 점검표 (${done}/${CHECK.length})`),
    h('p',{class:'note',style:'margin:0 0 4px'},'하루 동안 쓰면서 직접 확인하고 체크하세요. 안 되는 항목은 저한테 번호와 함께 알려 주세요. 체크는 이 브라우저에만 저장돼요.'),
    CHECK.map(([k,t],i)=>h('label',{class:'chk'},h('input',{type:'checkbox',checked:!!ck[k],onchange:e=>{const c=checkGet();c[k]=e.target.checked;try{localStorage.setItem('cb.check',JSON.stringify(c))}catch(x){}openSettings()}}),h('span',{},`${i+1}. ${t}`))));
}
function helpExtra(){
  const step=(t,...c)=>h('div',{class:'skl'},h('b',{},t),h('span',{},...c));
  return [h('h4',{class:'sh'},'3. 다른 기기에서 안전하게 쓰기 (Tailscale)'),
    step('왜 필요한가요','실행기를 --listen 0.0.0.0 으로 열면 같은 네트워크의 누구나 접속을 시도할 수 있고 연결도 암호화되지 않아요. 연결 코드가 열쇠이긴 하지만 그 코드가 그대로 오가요. 실시간 화면(VNC)을 위해 포트가 하나 더(실행기 포트 + 100) 같이 열려요.'),
    step('Tailscale 설치','tailscale.com 에서 실행기가 있는 컴퓨터와 쓸 기기(태블릿·폰)에 앱을 설치하고 같은 계정으로 로그인해요. 개인 사용은 무료예요. 기기마다 100.x.x.x 형태의 전용 주소가 생겨요.'),
    step('실행기를 그 주소로만 열기','실행기가 있는 컴퓨터에서 `tailscale ip -4` 로 주소를 확인하고, 실행기를 --listen 100.x.x.x:7717 로 켜세요. 이 주소는 Tailscale 에 가입한 내 기기끼리만 닿아서, 같은 와이파이의 다른 사람은 접속할 수 없어요. 실시간 화면 포트도 같은 주소에 열려요. 태블릿 브라우저에서는 http://100.x.x.x:7717 로 접속해요.'),
    step('확인','설정 > 진단 의 "접속 보안" 이 ✓ 이면 이 컴퓨터(또는 Tailscale)에서만 접속되는 상태예요. 이 부분은 아직 제 쪽에서 실제 Tailscale 로 시험하지 못했으니, 막히면 알려 주세요.')];
}

document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(Z.el)closeZoom();else if(S.dialog)closeDlg()});
render();connect();
</script>
